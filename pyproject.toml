[project]
name = "ego-annotation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chumpy>=0.70",
  "dill>=0.4.1",
  "einops>=0.8.2",
  "evo>=1.36.5",
  "fastapi>=0.115",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "hydra-submitit-launcher>=1.2.0",
  "httpx>=0.27",
  "mediapipe==0.10.14",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.9",
  "pandas>=3.0.3",
  "Pillow>=10.0",
  "pyarrow>=16.0",
  "python-multipart>=0.0.9",
  "plyfile>=1.1.3",
  "pycolmap>=4.0.4",
  "pyrender>=0.1.45",
  "pyrootutils>=1.0.4",
  "pytorch-lightning>=2.6.5",
  "ray[serve]>=2.40",
  "rich>=15.0.0",
  "rtree>=1.4.1",
  "scikit-image>=0.26.0",
  "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
  "smplx==0.1.28",
  "timm>=1.0.27",
  "torch>=2.0",
  "transformers>=5.9.0",
  "trimesh>=4.12.2",
  "ultralytics==8.1.34",
  "uvicorn>=0.32",
  "webdataset>=1.0.2",
  "xtcocotools>=1.14.3",
  "yacs>=0.1.8",
]

[tool.uv]
managed = true

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
